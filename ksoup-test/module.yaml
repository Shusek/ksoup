product:
  type: lib
  platforms: [ jvm, js, wasm, wasmWasi, android, linuxX64, linuxArm64, tvosArm64, tvosX64, tvosSimulatorArm64, macosX64, macosArm64, iosArm64, iosSimulatorArm64, iosX64, mingwX64 ]

apply: [ ../common.module-template.yaml ]

aliases:
  - jvmAndAndroid: [ jvm, android ]
  - nonWasm: [ jvm, js, android, linuxX64, linuxArm64, tvosArm64, tvosX64, tvosSimulatorArm64, macosX64, macosArm64, iosArm64, iosSimulatorArm64, iosX64, mingwX64 ]

repositories:
  - mavenLocal

test-dependencies:
  - $libs.fleeksoft.io.kotlinx
  - $libs.kotlinx.io
  - $libs.kotlinx.coroutines.test
  - $libs.kotlinx.datetime
  - $libs.stately.concurrency
#  - $libs.fleeksoft.charset.ext

test-dependencies@nonWasm:
  - $libs.korlibs.io

test-dependencies@jvmAndAndroid:
  - $libs.jsoup

settings:
  kotlin:
    optIns: [ kotlinx.cinterop.BetaInteropApi, kotlinx.cinterop.UnsafeNumber, kotlinx.cinterop.ExperimentalForeignApi, kotlin.experimental.ExperimentalNativeApi ]
